  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r; text-align:left;\">\n        <\u002Fdiv>\n        <label style=\"display:block; font-size:13px; font-weight:500; color:var(--text-2); margin-bottom:7px;\">كلمة المرور<\u002Flabel>\n        <div style=\"display:flex; align-items:center; gap:10px; padding:0 14px; height:48px; border-radius:12px; border:1.5px solid var(--primary); background:var(--bg); margin-bottom:6px; box-shadow:0 0 0 4px var(--primary-soft);\">\n          <span style=\"color:var(--primary); font-size:15px;\">🔒<\u002Fspan>\n          <input type=\"password\" value=\"123456789\" readonly=\"\" style=\"flex:1; border:none; outline:none; background:transparent; color:var(--text); font-family:inherit; font-size:14.5px; direction:ltr; text-align:left;\">\n          <span style=\"color:var(--text-3); font-size:14px; cursor:pointer;\">👁<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; color:var(--primary); margin-bottom:18px;\">↑ حالة التركيز (Focus)<\u002Fdiv>\n        <label style=\"display:block; font-size:13px; font-weight:500; color:var(--text-2); margin-bottom:7px;\">التقييم النصّي<\u002Flabel>\n        <textarea readonly=\"\" style=\"width:100%; min-height:74px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:14px; line-height:1.8; resize:none; outline:none;\">أتقن الطالب حفظ سورة الفاتحة مع مراعاة أحكام التجويد. يُنصح بمراجعة المدود.<\u002Ftextarea>\n      <\u002Fdiv>\n\n      <div style=\"border-radius:18px; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow); padding:30px;\">\n        <h2 style=\"font-family:var(--font-head); font-weight:700; font-size:22px; margin:0 0 20px;\">الحالات والوسوم<\u002Fh2>\n        <div style=\"font-size:12px; color:var(--text-3); font-weight:600; letter-spacing:.5px; margin-bottom:12px;\">الحضور<\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px;\">\n          <span style=\"display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; background:var(--primary-soft); color:var(--primary); font-size:13px; font-weight:600;\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--primary);\"><\u002Fspan>حاضر<\u002Fspan>\n          <span style=\"display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; background:color-mix(in srgb,#C0392B 14%,var(--surface)); color:#C0392B; font-size:13px; font-weight:600;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#C0392B;\"><\u002Fspan>غائب<\u002Fspan>\n          <span style=\"display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; background:var(--gold-soft); color:var(--gold-deep); font-size:13px; font-weight:600;\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--gold);\"><\u002Fspan>مأذون<\u002Fspan>\n          <span style=\"display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; background:var(--surface-2); color:var(--text-2); font-size:13px; font-weight:600;\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--text-3);\"><\u002Fspan>لم يُسجّل<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; color:var(--text-3); font-weight:600; letter-spacing:.5px; margin-bottom:12px;\">الأدوار<\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px;\">\n          <span style=\"display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg); font-size:13px; font-weight:600;\"><span style=\"font-size:14px;\">🎓<\u002Fspan>طالب<\u002Fspan>\n          <span style=\"display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg); font-size:13px; font-weight:600;\"><span style=\"font-size:14px;\">📖<\u002Fspan>معلّم<\u002Fspan>\n          <span style=\"display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px; border:1px solid color-mix(in srgb,var(--gold) 40%,transparent); background:var(--gold-soft); color:var(--gold-deep); font-size:13px; font-weight:600;\"><span style=\"font-size:14px;\">🛡<\u002Fspan>مشرف<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; color:var(--text-3); font-weight:600; letter-spacing:.5px; margin-bottom:12px;\">التقدّم في الحفظ<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:12px;\">\n          <div style=\"flex:1; height:12px; border-radius:999px; background:var(--surface-2); overflow:hidden;\"><div style=\"width:68%; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--primary),var(--primary-hover));\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-size:13px; font-weight:700; color:var(--primary);\">٦٨٪<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; color:var(--text-3); margin-top:8px;\">١٣ جزءاً من أصل ٣٠ · حلقة أهل القرآن<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- IN CONTEXT -->\n    <section style=\"padding:38px 0;\">\n      <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom:22px;\">\n        <h2 style=\"font-family:var(--font-head); font-weight:700; font-size:26px; margin:0;\">المكوّنات في سياقها<\u002Fh2>\n        <span style=\"font-size:13px; color:var(--text-2);\">نماذج لبطاقات تظهر في الواجهات الفعلية<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1.3fr 1fr; gap:16px;\">\n        <!-- Next session card -->\n        <div style=\"border-radius:20px; background:var(--primary); color:var(--on-primary); box-shadow:var(--shadow); padding:28px 30px; position:relative; overflow:hidden;\">\n          <div style=\"position:absolute; top:-30px; left:-20px; font-family:var(--font-head); font-size:160px; opacity:.08; line-height:1;\">۝<\u002Fdiv>\n          <div style=\"position:relative;\">\n            <div style=\"display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; background:color-mix(in srgb, var(--on-primary) 16%, transparent); font-size:12px; font-weight:600; margin-bottom:16px;\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--gold);\"><\u002Fspan>حصّتك القادمة<\u002Fdiv>\n            <div style=\"font-family:var(--font-head); font-weight:700; font-size:30px; margin-bottom:6px;\">حلقة رياض الجنة<\u002Fdiv>\n            <div style=\"font-size:14px; opacity:.85; margin-bottom:20px;\">مع المعلّم أحمد عبد الرحمن · اليوم 4:30 عصراً<\u002Fdiv>\n            <div style=\"display:flex; gap:12px; align-items:center;\">\n              <button style=\"padding:12px 26px; border-radius:12px; border:none; background:var(--on-primary); color:var(--primary); font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;\">ادخل الحصّة<\u002Fbutton>\n              <span style=\"font-size:13px; opacity:.8;\">يبدأ بعد ١٢ دقيقة<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- stat card -->\n        <div style=\"border-radius:20px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); padding:26px 28px; display:flex; flex-direction:column; justify-content:space-between;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:flex-start;\">\n            <div>\n              <div style=\"font-size:13px; color:var(--text-2); margin-bottom:6px;\">الحلقات النشطة اليوم<\u002Fdiv>\n              <div style=\"font-family:var(--font-head); font-weight:700; font-size:44px; line-height:1; color:var(--text);\">٨<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"width:44px; height:44px; border-radius:12px; background:var(--gold-soft); display:flex; align-items:center; justify-content:center; font-size:20px;\">📿<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:1px; background:var(--border); margin:18px 0;\"><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; font-size:13px;\">\n            <span style=\"color:var(--text-2);\">نسبة الحضور<\u002Fspan>\n            <span style=\"font-weight:700; color:var(--primary);\">٩٤٪ ▲<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { theme: 'light' };\n  renderVals() {\n    const dark = this.state.theme === 'dark';\n    return {\n      theme: this.state.theme,\n      themeLabel: dark ? 'الوضع الفاتح' : 'الوضع المظلم',\n      themeIcon: dark ? '☀' : '☾',\n      primaryHex: dark ? '#2D9955' : '#1B6B3A',\n      bgHex: dark ? '#0F1F16' : '#F7F7F5',\n      surfaceHex: dark ? '#16291D' : '#FFFFFF',\n      toggleTheme: () => this.setState(s => ({ theme: s.theme === 'light' ? 'dark' : 'light' })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
